[package]
name = "acme-champion"
version = "1.0.0"
edition = "2024"
authors = ["Jess Bees"]
description = "A tiny DNS resolver to answer ACME challenges"
repository = "https://github.com/toomanybees/acme-champion"
license-file = "LICENSE.txt"
keywords = ["ACME", "letsencrypt", "DNS", "authenticator"]
categories = ["authentication", "command-line-utilities"]
exclude = ["certbot-dns-champ"]

[dependencies]
httparse = "1.10.1"
mio = { version = "1.2.0", features = ["net", "os-poll"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-journald = { version = "0.3.2", optional = true }
tracing-subscriber = "0.3.22"

[features]
journald = ["tracing-journald"]
