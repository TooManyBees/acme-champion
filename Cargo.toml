[package]
name = "acme-champion"
version = "1.1.1"
edition = "2024"
authors = ["Jess Bees"]
description = "A tiny DNS resolver to answer ACME challenges"
repository = "https://github.com/toomanybees/acme-champion"
license-file = "LICENSE.txt"
keywords = ["ACME", "letsencrypt", "DNS", "authenticator"]
categories = ["authentication", "command-line-utilities"]
exclude = ["certbot-dns-champ"]

[dependencies]
anstyle = "1"
httparse = "1.10.1"
libc = "0.2"
log = { version = "0.4", features = ["kv"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "kv"] }
mio = { version = "1.2.0", features = ["net", "os-poll"] }
systemd-journal-logger = { version = "2.2.2", optional = true }

[features]
journald = [ "systemd-journal-logger" ]
