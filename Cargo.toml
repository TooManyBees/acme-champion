[package]
name = "acme-champion"
version = "0.1.0"
edition = "2024"

[dependencies]
httparse = "1.10.1"
mio = { version = "1.2.0", features = ["net", "os-poll"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-journald = { version = "0.3.2", optional = true }
tracing-subscriber = "0.3.22"

[features]
journald = ["tracing-journald"]
