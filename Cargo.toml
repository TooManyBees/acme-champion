[package]
name = "acme-champion"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.32"
hickory-proto = { version = "0.25.2" }
http-body-util = "0.1.3"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.50", features = ["macros", "net", "rt", "signal"] }
